name: Club Noel DMI - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Pytest
        run: uv run pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

  deploy-backend:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: clubnoel-backend
          IMAGE_TAG: latest
        run: |
          docker build -f backend/Dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy to AWS App Runner
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='clubnoel-backend-service'].ServiceArn" --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "Error: No se encontró el servicio App Runner 'clubnoel-backend-service'."
            exit 1
          fi

          echo "Servicio detectado con ARN: $SERVICE_ARN"

          # 1. Si está en estado PAUSED, reanudar
          STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
          if [ "$STATUS" == "PAUSED" ]; then
            echo "El servicio está pausado. Reanudando..."
            aws apprunner resume-service --service-arn $SERVICE_ARN
          fi

          # 2. Disparar el despliegue directo sin bucles restrictivos innecesarios
          echo "Iniciando despliegue en App Runner..."
          aws apprunner start-deployment --service-arn $SERVICE_ARN
          echo "¡Despliegue disparado con éxito hacia ECR!"

  deploy-frontend:
    needs: [test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build, Deploy to S3 and Invalidate CloudFront
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name clubnoel-dmi-stack --query "Stacks[0].Outputs")

          BUCKET_NAME=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')
          DISTRIBUTION_ID=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')
          BACKEND_URL=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="BackendURL") | .OutputValue')

          echo "Compilando Frontend apuntando a https://$BACKEND_URL..."
          VITE_API_URL="https://$BACKEND_URL" npm run build

          echo "Sincronizando archivos con el bucket S3: $BUCKET_NAME"
          aws s3 sync dist/ s3://$BUCKET_NAME --delete

          echo "Creando invalidación en CloudFront para la distribución: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
