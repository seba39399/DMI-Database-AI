name: Club Noel DMI - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Pytest
        run: uv run pytest -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run

  deploy-backend:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: clubnoel-backend
          IMAGE_TAG: latest
        run: |
          docker build -f backend/Dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy to AWS App Runner
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='clubnoel-backend-service'].ServiceArn" --output text)

          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "El servicio no existe. Creándolo por primera vez en App Runner..."
            
            # Crear el servicio nuevo apuntando a la imagen en ECR y configurando variables de entorno de RDS
            CREATE_OUTPUT=$(aws apprunner create-service \
              --service-name clubnoel-backend-service \
              --source-configuration '{
                "AuthenticationConfiguration": {
                  "AccessRoleArn": "arn:aws:iam::615296308634:role/service-role/AppRunnerECRAccessRole"
                },
                "AutoDeploymentsEnabled": true,
                "ImageRepository": {
                  "ImageIdentifier": "615296308634.dkr.ecr.us-east-1.amazonaws.com/clubnoel-backend:latest",
                  "ImageRepositoryType": "ECR",
                  "ImageConfiguration": {
                    "Port": "8000",
                    "RuntimeEnvironmentVariables": {
                      "PORT": "8000",
                      "DB_HOST": "clubnoel-db.cyzaykg4uhpx.us-east-1.rds.amazonaws.com",
                      "DB_NAME": "clubnoel_dmi",
                      "DB_USER": "postgres",
                      "DB_PASSWORD": "ClubNoelSecurePassword2026!"
                    }
                  }
                }
              }' \
              --instance-configuration '{"Cpu": "1024", "Memory": "2048"}' \
              --health-check-configuration '{"Protocol": "HTTP", "Path": "/health", "Interval": 10, "Timeout": 5, "HealthyThreshold": 1, "UnhealthyThreshold": 5}')

            SERVICE_ARN=$(echo $CREATE_OUTPUT | jq -r '.Service.ServiceArn')
            echo "¡Servicio creado exitosamente con ARN: $SERVICE_ARN!"
          else
            echo "Servicio detectado con ARN: $SERVICE_ARN"
            
            # 1. Si está en estado PAUSED, reanudar
            STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
            if [ "$STATUS" == "PAUSED" ]; then
              echo "El servicio está pausado. Reanudando..."
              aws apprunner resume-service --service-arn $SERVICE_ARN
            fi

            # 2. Disparar el despliegue de la nueva imagen
            echo "Iniciando despliegue de la nueva imagen en App Runner..."
            aws apprunner start-deployment --service-arn $SERVICE_ARN
          fi

          # 3. Esperar pacientemente a que el servicio esté en estado RUNNING
          echo "Esperando a que el servicio esté listo (RUNNING)..."
          while true; do
            CURRENT_STATUS=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query "Service.Status" --output text)
            echo "Estado actual del servicio: $CURRENT_STATUS"
            
            if [ "$CURRENT_STATUS" == "RUNNING" ]; then
              echo "¡El servicio ya está activo y operando con éxito!"
              break
            elif [ "$CURRENT_STATUS" == "CREATE_FAILED" ] || [ "$CURRENT_STATUS" == "OPERATION_FAILED" ]; then
              echo "Error crítico: El servicio falló durante su despliegue."
              exit 1
            fi
            
            sleep 15
          done

  deploy-frontend:
    needs: [test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build, Deploy to S3 and Invalidate CloudFront
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name clubnoel-dmi-stack --query "Stacks[0].Outputs")

          BUCKET_NAME=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')
          DISTRIBUTION_ID=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendDistributionId") | .OutputValue')
          BACKEND_URL=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="BackendURL") | .OutputValue')

          echo "Compilando Frontend apuntando a https://$BACKEND_URL..."
          VITE_API_URL="https://$BACKEND_URL" npm run build

          echo "Sincronizando archivos con el bucket S3: $BUCKET_NAME"
          aws s3 sync dist/ s3://$BUCKET_NAME --delete

          echo "Creando invalidación en CloudFront para la distribución: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
