AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation Template for Club Noel DMI Infrastructure (Frontend S3+CloudFront, Backend AppRunner, RDS Postgres)"

Parameters:
  BackendImageIdentifier:
    Type: String
    Default: "public.ecr.aws/aws-containers/hello-app-runner:latest"
    Description: "Public ECR image identifier"

Resources:
  # ============================================================================
  # FRONTEND INFRASTRUCTURE (S3 + CloudFront CDN)
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "clubnoel-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "ClubNoelFrontendOAC-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200

  # ============================================================================
  # DATABASE INFRASTRUCTURE (AWS RDS PostgreSQL)
  # ============================================================================
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allow inbound access to PostgreSQL from App Runner"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  AppRunnerDatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: clubnoel-db
      AllocatedStorage: "20"
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      MasterUsername: postgres
      MasterUserPassword: "ClubNoelSecurePassword2026!"
      DBName: clubnoel_dmi
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      PubliclyAccessible: true

  # ============================================================================
  # BACKEND INFRASTRUCTURE (AWS App Runner for FastAPI)
  # ============================================================================
  BackendAppRunnerService:
    Type: AWS::AppRunner::Service
    DependsOn: AppRunnerDatabaseInstance
    Properties:
      ServiceName: clubnoel-backend-service
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref BackendImageIdentifier
          ImageRepositoryType: ECR_PUBLIC
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              - Name: PORT
                Value: "8000"
              - Name: DB_HOST
                Value: !GetAtt AppRunnerDatabaseInstance.Endpoint.Address
              - Name: DB_PORT
                Value: !GetAtt AppRunnerDatabaseInstance.Endpoint.Port
              - Name: DB_NAME
                Value: "clubnoel_dmi"
              - Name: DB_USER
                Value: "postgres"
              - Name: DB_PASSWORD
                Value: "ClubNoelSecurePassword2026!"

Outputs:
  FrontendBucketName:
    Description: "S3 Bucket name for Frontend"
    Value: !Ref FrontendBucket

  FrontendDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref FrontendDistribution

  FrontendURL:
    Description: "Public Frontend URL"
    Value: !GetAtt FrontendDistribution.DomainName

  BackendURL:
    Description: "Public AWS App Runner URL (FastAPI)"
    Value: !GetAtt BackendAppRunnerService.ServiceUrl

  DatabaseEndpoint:
    Description: "PostgreSQL RDS Endpoint"
    Value: !GetAtt AppRunnerDatabaseInstance.Endpoint.Address
